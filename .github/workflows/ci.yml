name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: CI (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: linux-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - id: linux-tcc
            os: ubuntu-latest
            c_compiler: tcc
            cpp_compiler: g++
          - id: macos-clang
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: windows-cl
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - id: windows-mingw
            os: windows-latest
            c_compiler: mingw
            cpp_compiler: g++
    uses: ./.github/workflows/ci-cell.yml
    with:
      cell-id: ${{ matrix.id }}
      os: ${{ matrix.os }}
      c-compiler: ${{ matrix.c_compiler }}
      cpp-compiler: ${{ matrix.cpp_compiler }}
      build-type: Release
      # TinyCC: library build/install only (-T). Re-enable when STLSoft/xTests
      # support TinyCC (see TODO.md).
      run-tests: ${{ matrix.id != 'linux-tcc' }}

  # File: labels and XTESTS_START_RUNNER names. Source text only, so this
  # job is one Ubuntu runner, not a cell per platform and compiler. The
  # checker is STLSoft .dev/bin/check_unit_test_names.rb (not installed with
  # the package). -R is this project. A mismatch total exits non-zero.
  check-test-names:
    name: Check test names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out STLSoft
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: _stlsoft
          repository: synesissoftware/STLSoft

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install checker dependencies
        run: gem install highline libclimate-ruby recls-ruby xqsr3

      - name: "Check File: labels and runner names"
        run: ./_stlsoft/.dev/bin/check_unit_test_names.rb -R . examples test
