name: CI cell

on:
  workflow_call:
    inputs:
      cell-id:
        required: true
        type: string
      os:
        required: true
        type: string
      c-compiler:
        required: true
        type: string
      cpp-compiler:
        required: true
        type: string
      build-type:
        required: false
        type: string
        default: Release
      run-tests:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build (${{ inputs.cell-id }})
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && inputs.c-compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install TinyCC (Ubuntu)
        if: runner.os == 'Linux' && inputs.c-compiler == 'tcc'
        run: sudo apt-get update && sudo apt-get install -y tcc

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      # Dependency order is deliberate (not lexicographic): each package
      # configures against those already installed in the shared prefix.
      # shwild precedes xTests. TinyCC cells skip deps (library-only).
      - name: Install SIS dependencies
        if: inputs.run-tests
        uses: ./.github/actions/install-sis-deps
        with:
          build-type: ${{ inputs.build-type }}
          c-compiler: ${{ inputs.c-compiler == 'mingw' && 'gcc' || inputs.c-compiler }}
          cpp-compiler: ${{ inputs.c-compiler == 'mingw' && 'g++' || inputs.cpp-compiler }}
          dependencies: STLSoft shwild xTests
          toolchain: ${{ inputs.c-compiler == 'mingw' && 'mingw' || '' }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.run-tests }}" = "true" ]; then
            BuildTesting=ON
          else
            # Equivalent to prepare_cmake.sh -T
            BuildTesting=OFF
          fi
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake -B build -S . \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=$BuildTesting
          elif [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -B build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=$BuildTesting
          else
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
              -DCMAKE_C_COMPILER="${{ inputs.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ inputs.cpp-compiler }}" \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=$BuildTesting
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake --build build --config "${{ inputs.build-type }}" --parallel
          elif [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake --build build --parallel 2
          else
            cmake --build build --parallel
          fi

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/install-prefix"
          if [ "${{ inputs.c-compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            cmake --install build --config "${{ inputs.build-type }}" --prefix "$PREFIX"
          else
            cmake --install build --prefix "$PREFIX"
          fi
          test -f "$PREFIX/include/2be/2be.h"
          if [ "${{ inputs.c-compiler }}" = "cl" ]; then
            test -f "$PREFIX/lib/2be.lib" || test -f "$PREFIX/lib/lib2be.lib"
          else
            test -f "$PREFIX/lib/lib2be.a"
          fi
          test -f "$PREFIX/lib/cmake/2be/2be-config.cmake"

      - name: Upload build tree
        if: inputs.run-tests
        uses: actions/upload-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build
          retention-days: 1

  # Windows cells dogfood the native .cmd runners (never the .sh); every
  # other cell uses the Bash runners. download-artifact strips execute bits.
  test-unit:
    name: Unit tests (${{ inputs.cell-id }})
    if: inputs.run-tests
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Exclude CMakeFiles/ and compiler artefacts (*.d/*.o/*.obj) so
      # chmod +x does not make dependency files look like programs.
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Run unit tests (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_unit_tests.sh -M --unit-only

      - name: Run unit tests (native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if "${{ inputs.c-compiler }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_unit_tests.cmd --unit-only
          if errorlevel 1 exit /b 1

  test-scratch:
    name: Scratch tests (${{ inputs.cell-id }})
    if: inputs.run-tests
    needs: build
    continue-on-error: true
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.c-compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Exclude CMakeFiles/ and compiler artefacts (*.d/*.o/*.obj) so
      # chmod +x does not make dependency files look like programs.
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Run scratch tests (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" ./run_all_scratch_tests.sh -M

      - name: Run scratch tests (native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if "${{ inputs.c-compiler }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_scratch_tests.cmd
          if errorlevel 1 exit /b 1
